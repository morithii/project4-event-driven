# =============================================================================
# CI/CD for Project 4
#   Pull request to main -> validate only (no AWS access)
#   Push to main         -> validate, then build and deploy with SAM
# AWS access uses OIDC: no long-lived keys are stored in GitHub.
# =============================================================================
name: Deploy SAM application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # lets the workflow request an OIDC token from GitHub (needed for AWS login)
  contents: read    # read-only access to the repo code

jobs:
  # Job 1: check the template is valid. Needs no AWS credentials.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # download the repo onto the runner

      - uses: aws-actions/setup-sam@v2     # install the SAM CLI
        with:
          use-installer: true

      - name: Lint template
        run: sam validate --lint

  # Job 2: build and deploy - only on pushes to main, and only if validate passed
  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-production         # never run two deploys at once - they'd clash on the same stack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4        # same Node version as the Lambda runtime (nodejs22.x)
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Swap GitHub's OIDC token for temporary AWS credentials (about 1 hour),
      # by assuming the role created from infra/github-oidc-role.yaml
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Build
        run: sam build                     # packages each function's code into .aws-sam/

      # The email secret is passed through an environment variable rather than
      # written straight into the command - GitHub's recommended pattern, because
      # a value inserted directly into a "run" script could be read as shell code
      # (script injection). GitHub also masks secrets as *** in logs.
      - name: Deploy
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: >-
          sam deploy
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides "NotificationEmail=$NOTIFICATION_EMAIL"