# =============================================================================
# CI/CD for Project 4
#   Pull request to main -> validate only (no AWS access)
#   Push to main         -> validate, build once, deploy to BOTH regions
# AWS access uses OIDC: no long-lived keys are stored in GitHub.
# =============================================================================
name: Deploy SAM application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # lets the workflow request an OIDC token from GitHub (needed for AWS login)
  contents: read    # read-only access to the repo code

jobs:
  # Job 1: check the template is valid. Needs no AWS credentials.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Lint template
        run: sam validate --lint

  # Job 2: build once, then deploy the same build to both regions
  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-production         # never run two deploys at once
    env:
      # Masked as *** in logs. Passed via env, not inline, to avoid script injection.
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4        # same Node version as the Lambda runtime (nodejs22.x)
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # IAM roles are global, so one OIDC login works for both regions
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Build
        run: sam build                     # one build artifact, deployed twice

      # SECONDARY FIRST: the global endpoint (created in London) points at
      # Ireland's event bus, so that bus must already exist.
      - name: Deploy secondary region (Ireland, eu-west-1)
        run: >-
          sam deploy
          --region eu-west-1
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides "NotificationEmail=$NOTIFICATION_EMAIL"

      - name: Deploy primary region (London, eu-west-2)
        run: >-
          sam deploy
          --region eu-west-2
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides "NotificationEmail=$NOTIFICATION_EMAIL"