# =============================================================================
# Project 4 - Event-Driven Orders Application
# Flow:
#   POST /orders -> API Gateway (Cognito auth + JSON Schema validation)
#                -> SQS intake queue -> returns 202 Accepted immediately
#   Intake queue -> CreateOrder Lambda -> DynamoDB Orders table
#                -> EventBridge (OrderCreated event)
#   OrderCreated fans out to three independent consumers:
#     -> SQS fulfilment queue -> FulfilOrder Lambda -> DynamoDB Fulfilments table
#     -> SNS topic -> email notification
#     -> CloudWatch Logs (debug copy of every event)
#   GET /orders/{id} -> API Gateway -> DynamoDB directly (no Lambda)
# Reliability: each SQS queue has a dead-letter queue (DLQ); a message that
#              fails 3 times is moved aside and an alarm fires
# Monitoring: CloudWatch dashboard + alarms (emailed via an alerts topic),
#             X-Ray tracing on the API and both Lambdas
# =============================================================================
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31   # makes this a SAM template (enables AWS::Serverless::* shorthand)
Description: Project 4 - Event-Driven Orders Application

# Values supplied at deploy time instead of being written into the template.
# The pipeline passes NotificationEmail from a GitHub secret, so the address
# never appears in this public repo.
Parameters:
  NotificationEmail:
    Type: String
    NoEcho: true                        # CloudFormation shows *** instead of the value in the console/API
    Description: Email address that receives order notifications and alarm alerts
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'   # basic email shape check - fails fast if the secret is missing
    ConstraintDescription: must be a valid email address

# Settings applied to every function/API in this template, so they aren't repeated
Globals:
  Function:
    Runtime: nodejs22.x       # Node.js version Lambda runs the code on
    Architectures:
      - arm64                 # Graviton processors: ~20% cheaper than x86 for the same work
    MemorySize: 256           # MB; CPU is allocated in proportion to memory
    Timeout: 10               # seconds before Lambda kills a stuck invocation
    Tags:
      Project: project4-event-driven
  Api:
    OpenApiVersion: '3.0.1'   # stops SAM creating an extra unused "Stage" stage

Resources:

  # ---------------------------------------------------------------------------
  # DATA
  # ---------------------------------------------------------------------------

  # Stores orders. One row per item: orderId groups an order's rows, itemId tells them apart.
  # Regular single-region table - multi-region returns in the Global Endpoints exercise.
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: project4-orders
      BillingMode: PAY_PER_REQUEST      # on-demand: pay per request, no capacity planning
      AttributeDefinitions:             # only key attributes are declared; others are schemaless
        - AttributeName: orderId
          AttributeType: S              # S = string
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH                 # partition key: decides which partition stores the row
        - AttributeName: itemId
          KeyType: RANGE                # sort key: orders rows within the same orderId
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   # restore the table to any second in the last 35 days
      Tags:
        - Key: Project
          Value: project4-event-driven

  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------------------------

  # The user directory. API callers must log in here to get a token.
  OrdersUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: project4-orders-users
      UsernameAttributes:
        - email                         # users log in with their email address
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email        # password resets go to the verified email
            Priority: 1
      UserPoolTags:
        Project: project4-event-driven

  # The "app" allowed to log users in. Its ID is used by initiate-auth.
  OrdersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: project4-orders-client
      UserPoolId: !Ref OrdersUserPool
      GenerateSecret: false             # public client (CLI/browser) - a secret couldn't be kept safe
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH      # log in with username + password (what our curl tests use)
        - ALLOW_REFRESH_TOKEN_AUTH      # swap a refresh token for new tokens without a password
      PreventUserExistenceErrors: ENABLED   # same error for "wrong password" and "no such user"
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits:
        IdToken: minutes                # tokens expire after 60 minutes
        AccessToken: minutes

  # ---------------------------------------------------------------------------
  # ORDER INTAKE (Exercise 6) + its dead-letter queue (Exercise 7)
  # API Gateway writes new orders straight into this queue; CreateOrder
  # consumes it. The API answers 202 without waiting for processing.
  # ---------------------------------------------------------------------------

  # Dead-letter queue: receives intake messages that failed 3 times, so they
  # stop being retried but are KEPT for a human to inspect and redrive.
  OrderIntakeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: project4-order-intake-dlq
      # 14 days - the maximum. A message keeps its ORIGINAL timestamp when it
      # moves to a DLQ, so the DLQ must keep messages longer than the source
      # queue (4 days), or old failures would expire before anyone sees them.
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      # Only the intake queue may use this DLQ. The ARN is built from the name
      # with !Sub (not !GetAtt) on purpose: the intake queue already references
      # THIS queue, and referencing it back would be a circular dependency
      # that CloudFormation refuses to deploy.
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:project4-order-intake-queue
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Holds accepted orders until CreateOrder processes them. If CreateOrder or
  # DynamoDB is having problems, orders wait here safely instead of failing.
  OrderIntakeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: project4-order-intake-queue
      VisibilityTimeout: 60             # >= 6x the Lambda timeout (10s), so a slow attempt isn't duplicated
      MessageRetentionPeriod: 345600    # 4 days
      SqsManagedSseEnabled: true        # encrypted at rest
      # After 3 failed receives, SQS moves the message to the DLQ instead of
      # retrying it for 4 days. 3 = enough to ride out a brief glitch (throttling,
      # a deploy), few enough that a truly broken message is set aside quickly.
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderIntakeDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Role API Gateway assumes to put messages on the intake queue.
  # Least privilege: SendMessage only, on this queue only.
  ApiGatewaySqsSendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToOrderIntakeQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OrderIntakeQueue.Arn
      Tags:
        - Key: Project
          Value: project4-event-driven

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------

  # Role API Gateway assumes for GET /orders/{id}, so it can query DynamoDB itself.
  # Least privilege: Query only, on this table only.
  ApiGatewayDynamoDBReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:         # trust policy: WHO can use this role (API Gateway)
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:                         # permissions: WHAT the role can do
        - PolicyName: QueryOrdersTable
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
      Tags:
        - Key: Project
          Value: project4-event-driven

  # The REST API. Routes are defined in OpenAPI format inside DefinitionBody.
  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: project4-orders-api
      StageName: prod                   # becomes the /prod part of the URL
      TracingEnabled: true              # X-Ray: traces start at the API, so one trace covers the whole request
      Auth:
        DefaultAuthorizer: CognitoAuthorizer   # every route needs a valid Cognito token
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt OrdersUserPool.Arn
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: project4-orders-api
          version: '1.0'

        # Validators available to methods. "body-only" checks the request body
        # against the method's JSON Schema model; bad requests get a 400 and
        # never reach the queue.
        x-amazon-apigateway-request-validators:
          body-only:
            validateRequestBody: true
            validateRequestParameters: false

        # Custom error for failed validation. The default just says "Invalid
        # request body"; this adds WHICH rule failed, so callers can fix it.
        x-amazon-apigateway-gateway-responses:
          BAD_REQUEST_BODY:
            statusCode: 400
            responseTemplates:
              application/json: '{"message": "Invalid order", "details": "$context.error.validationErrorString"}'

        paths:
          # POST /orders -> validate -> SQS intake queue -> 202 Accepted
          /orders:
            post:
              summary: Accept an order for asynchronous processing
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-request-validator: body-only
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Order'
              responses:
                '202':
                  description: Order accepted for processing
                '400':
                  description: Request body failed validation
                '500':
                  description: Order could not be queued
              x-amazon-apigateway-integration:
                type: aws                 # direct AWS service integration - no Lambda
                httpMethod: POST          # SQS's API is called with POST
                # "sqs:path/<account>/<queue>" = call the SQS API for this queue
                uri: !Sub arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${OrderIntakeQueue.QueueName}
                credentials: !GetAtt ApiGatewaySqsSendRole.Arn
                passthroughBehavior: never   # reject content types we have no template for (415)
                # SQS's API expects form-encoded parameters, not JSON
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                # Builds the SendMessage call:
                #   MessageBody   = the client's JSON, URL-encoded
                #   orderId       = $context.requestId (unique ID API Gateway gives every request)
                #   acceptedAt    = when API Gateway received it (epoch milliseconds)
                # The IDs travel as MESSAGE ATTRIBUTES - metadata alongside the body.
                requestTemplates:
                  application/json: 'Action=SendMessage&MessageBody=$util.urlEncode($input.body)&MessageAttribute.1.Name=orderId&MessageAttribute.1.Value.DataType=String&MessageAttribute.1.Value.StringValue=$context.requestId&MessageAttribute.2.Name=acceptedAt&MessageAttribute.2.Value.DataType=Number&MessageAttribute.2.Value.StringValue=$context.requestTimeEpoch'
                # Map SQS's reply to OUR response. Keys are patterns matched
                # against SQS's HTTP status:
                #   2xx     -> 202 with the orderId
                #   default -> anything else (SQS error) -> 500, so failures aren't
                #              hidden behind a fake "accepted"
                responses:
                  '2\d{2}':
                    statusCode: '202'
                    responseTemplates:
                      application/json: '{"orderId": "$context.requestId", "status": "ACCEPTED", "message": "Order accepted for processing"}'
                  default:
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message": "Could not accept order, please retry"}'

          # GET /orders/{orderId} -> DynamoDB Query directly, no Lambda
          /orders/{orderId}:
            get:
              summary: Get an order directly from DynamoDB (no Lambda)
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuthorizer: []
              responses:
                '200':
                  description: The order
                '404':
                  description: Order not found
              x-amazon-apigateway-integration:
                type: aws                 # non-proxy: we translate request/response with templates
                httpMethod: POST          # DynamoDB's API is always called with POST
                uri: !Join ["", ["arn:aws:apigateway:", !Ref "AWS::Region", ":dynamodb:action/Query"]]
                credentials: !GetAtt ApiGatewayDynamoDBReadRole.Arn
                passthroughBehavior: never
                # Request template: turns the URL's orderId into a DynamoDB Query.
                # The table name is hard-coded because this is VTL text, not a CloudFormation
                # property - keep it in sync with OrdersTable.TableName.
                requestTemplates:
                  application/json: |
                    {
                      "TableName": "project4-orders",
                      "KeyConditionExpression": "orderId = :o",
                      "ExpressionAttributeValues": {
                        ":o": {"S": "$util.escapeJavaScript($input.params('orderId'))"}
                      }
                    }
                # Response template: reshapes DynamoDB's typed JSON ({"S": "..."}) into
                # clean JSON, and returns 404 when no rows were found.
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($inputRoot = $input.path('$'))
                        #if($inputRoot.Count == 0)
                        #set($context.responseOverride.status = 404)
                        {"message": "Order not found"}
                        #else
                        {
                          "orderId": "$inputRoot.Items[0].orderId.S",
                          "customerId": "$inputRoot.Items[0].customerId.S",
                          "createdAt": "$inputRoot.Items[0].createdAt.S",
                          "items": [
                        #foreach($item in $inputRoot.Items)
                            {"itemId": "$item.itemId.S", "productId": "$item.productId.S", "quantity": $item.quantity.N, "price": $item.price.N}#if($foreach.hasNext),#end
                        #end
                          ]
                        }
                        #end

        # JSON Schema (draft 4) for a valid order. API Gateway enforces it
        # before anything is queued - this replaces the validation that used
        # to live at the top of the CreateOrder Lambda.
        components:
          schemas:
            Order:
              type: object
              required:
                - customerId
                - items
              additionalProperties: false   # reject unexpected fields
              properties:
                customerId:
                  type: string
                  minLength: 1
                items:
                  type: array
                  minItems: 1
                  maxItems: 100             # DynamoDB transactions allow at most 100 operations
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                      - price
                    additionalProperties: false
                    properties:
                      productId:
                        type: string
                        minLength: 1
                      quantity:
                        type: integer
                        minimum: 1
                      price:
                        type: number
                        minimum: 0
      Tags:
        Project: project4-event-driven

  # ---------------------------------------------------------------------------
  # EVENTS (Exercise 1)
  # ---------------------------------------------------------------------------

  # Custom event bus for this app. The account's "default" bus receives AWS
  # service events; a custom bus keeps our order events separate, so our
  # rules only ever see our events.
  OrdersEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: project4-orders-bus
      Tags:
        - Key: Project
          Value: project4-event-driven

  # DEBUG: a bus with no rules silently discards events. This log group, plus
  # the rule below, keeps a copy of every order event so we can see what's
  # being published.
  OrderEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/events/project4-orders-bus   # must start with /aws/events/ for EventBridge
      RetentionInDays: 7                              # auto-delete after a week, so costs stay at ~0

  # Resource policy ON the log group, allowing EventBridge to write into it.
  # Without this the rule still matches, but nothing arrives - and no error is shown.
  OrderEventsLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: project4-orders-bus-to-logs
      PolicyDocument: !Sub '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["events.amazonaws.com","delivery.logs.amazonaws.com"]},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"${OrderEventsLogGroup.Arn}"}]}'

  # Rule: "any event from source project4.orders -> copy it to the log group"
  LogAllOrderEventsRule:
    Type: AWS::Events::Rule
    DependsOn: OrderEventsLogGroupPolicy   # create the permission first, so no early events are dropped
    Properties:
      Name: project4-log-all-order-events
      EventBusName: !Ref OrdersEventBus    # listen on our custom bus, not "default"
      State: ENABLED
      EventPattern:                        # which events match: only those with this source
        source:
          - project4.orders
      Targets:
        - Id: OrderEventsLogGroup
          Arn: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OrderEventsLogGroup}

  # ---------------------------------------------------------------------------
  # FULFILMENT (Exercise 2) + its dead-letter queue (Exercise 7)
  # OrderCreated -> rule -> FulfilmentQueue -> FulfilOrder Lambda -> FulfilmentsTable
  # ---------------------------------------------------------------------------

  # One row per order, recording its fulfilment status. Separate from the
  # Orders table because it belongs to a different part of the business
  # (the warehouse), which owns its own data.
  FulfilmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: project4-fulfilments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH                 # one fulfilment per order, so no sort key needed
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Dead-letter queue for fulfilment messages that failed 3 times.
  # Same settings and reasoning as OrderIntakeDLQ.
  FulfilmentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: project4-fulfilment-dlq
      MessageRetentionPeriod: 1209600   # 14 days - longer than the source queue's 4
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:project4-fulfilment-queue
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Buffer between EventBridge and FulfilOrder: absorbs spikes, keeps messages
  # safe if the Lambda is failing, and retries them automatically.
  FulfilmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: project4-fulfilment-queue
      # How long a message is hidden from other consumers while Lambda works on it.
      # AWS recommends at least 6x the function timeout (10s), so a slow attempt
      # isn't handed to a second Lambda while the first is still running.
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600    # 4 days (in seconds) before an unprocessed message is deleted
      SqsManagedSseEnabled: true        # encrypt messages at rest, using SQS-managed keys (free)
      RedrivePolicy:                    # 3 failed attempts -> move to the DLQ
        deadLetterTargetArn: !GetAtt FulfilmentDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Resource policy ON the queue: lets EventBridge send messages into it, but
  # ONLY from our fulfilment rule. Without this, the rule matches events but
  # delivery silently fails.
  FulfilmentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FulfilmentQueue          # !Ref on a queue returns its URL
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FulfilmentQueue.Arn
            Condition:
              ArnEquals:
                # Without this condition, ANY EventBridge rule in ANY account
                # could push messages into the queue (the "confused deputy" problem)
                aws:SourceArn: !GetAtt OrderCreatedToFulfilmentRule.Arn

  # Rule: "OrderCreated events from our app -> the fulfilment queue".
  # More specific than the debug rule: it also matches on detail-type, so
  # future event types (e.g. OrderCancelled) won't be sent to fulfilment.
  OrderCreatedToFulfilmentRule:
    Type: AWS::Events::Rule
    Properties:
      Name: project4-order-created-to-fulfilment
      EventBusName: !Ref OrdersEventBus
      State: ENABLED
      EventPattern:
        source:
          - project4.orders
        detail-type:
          - OrderCreated
      Targets:
        - Id: FulfilmentQueue
          Arn: !GetAtt FulfilmentQueue.Arn

  # ---------------------------------------------------------------------------
  # NOTIFICATIONS (Exercise 3)
  # OrderCreated -> rule (reshapes the event into a readable sentence)
  #              -> SNS topic -> email subscription
  # ---------------------------------------------------------------------------

  # Pub/sub topic: every message published here is PUSHED to all subscribers.
  # Today that's one email address; SMS, HTTP endpoints or Lambdas could be
  # added as subscribers later without changing anything else.
  OrderNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: project4-order-notifications
      DisplayName: Project4 Orders      # shown as the sender name on notification emails
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Email subscriber. AWS sends a confirmation email first - nothing is
  # delivered until the link in it is clicked (stops people being spammed
  # by subscriptions they never agreed to).
  OrderNotificationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderNotificationsTopic   # !Ref on an SNS topic returns its ARN
      Protocol: email
      Endpoint: !Ref NotificationEmail         # from the Parameters section (GitHub secret)

  # Resource policy ON the topic: lets EventBridge publish to it, but ONLY
  # from our notification rule. Same pattern as the SQS queue policy.
  OrderNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderCreatedToNotificationRule.Arn

  # Rule: "OrderCreated -> SNS topic", with an INPUT TRANSFORMER.
  # Without the transformer, the email body would be the raw event JSON.
  # The transformer picks fields out of the event (InputPathsMap) and drops
  # them into a sentence (InputTemplate) - no Lambda needed to format it.
  OrderCreatedToNotificationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: project4-order-created-to-notification
      EventBusName: !Ref OrdersEventBus
      State: ENABLED
      EventPattern:
        source:
          - project4.orders
        detail-type:
          - OrderCreated
      Targets:
        - Id: OrderNotificationsTopic
          Arn: !Ref OrderNotificationsTopic
          InputTransformer:
            InputPathsMap:                  # name: JSON path into the event
              orderId: $.detail.orderId
              customerId: $.detail.customerId
              itemCount: $.detail.itemCount
              createdAt: $.detail.createdAt
            # <name> placeholders are replaced with the values above. The outer
            # single quotes are YAML; the inner double quotes make it a JSON string.
            InputTemplate: '"New order <orderId> from customer <customerId>: <itemCount> item(s), placed at <createdAt>."'

  # ---------------------------------------------------------------------------
  # COMPUTE
  # ---------------------------------------------------------------------------

  # Consumes the intake queue: saves each accepted order to DynamoDB, then
  # announces it by publishing an OrderCreated event to the bus.
  CreateOrderFunction:
    Type: AWS::Serverless::Function     # SAM shorthand: expands into a Lambda function plus its IAM role
    Properties:
      FunctionName: project4-create-order
      Description: Saves queued orders and publishes OrderCreated events
      CodeUri: src/create-order/        # folder SAM packages and uploads as the function's code
      Handler: index.handler            # file "index", exported function "handler"
      Tracing: Active                   # X-Ray traces: see each call this function makes and how long it takes
      Environment:
        Variables:                      # read in code via process.env, so nothing is hard-coded
          TABLE_NAME: !Ref OrdersTable          # !Ref on a table returns its name
          EVENT_BUS_NAME: !Ref OrdersEventBus   # !Ref on an event bus returns its name
      Policies:                         # SAM builds the function's IAM role from these
        - DynamoDBWritePolicy:          # write-only, this table only
            TableName: !Ref OrdersTable
        - EventBridgePutEventsPolicy:   # events:PutEvents on this bus only - least privilege
            EventBusName: !Ref OrdersEventBus
      Events:
        # Lambda polls the intake queue and invokes this function with batches
        OrderIntakeQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderIntakeQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures   # retry only the messages that failed

  # Consumes the fulfilment queue: records each new order as awaiting shipment.
  FulfilOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: project4-fulfil-order
      Description: Reads OrderCreated messages from SQS and records them for fulfilment
      CodeUri: src/fulfil-order/
      Handler: index.handler
      Tracing: Active
      Environment:
        Variables:
          FULFILMENTS_TABLE_NAME: !Ref FulfilmentsTable
      Policies:
        - DynamoDBWritePolicy:          # write-only, Fulfilments table only
            TableName: !Ref FulfilmentsTable
        # (No SQS policy needed here: SAM automatically grants permission to
        #  read and delete messages from the queue named in the event below.)
      Events:
        # Creates an "event source mapping": Lambda's own service polls the
        # queue and invokes this function with batches of messages.
        FulfilmentQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt FulfilmentQueue.Arn
            BatchSize: 10               # up to 10 messages per invocation
            FunctionResponseTypes:
              # Lets the function report WHICH messages in a batch failed, so only
              # those are retried - not the whole batch of 10.
              - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # ALERTING (Exercises 4 and 7)
  # Alarms watch metrics for us and email the alerts topic when something breaks.
  # Common settings on every alarm below:
  #   Period 60 + EvaluationPeriods 1 -> judge each 1-minute window on its own
  #   TreatMissingData: notBreaching  -> NO data means "nothing happened", which
  #     is fine. Many of these metrics only appear when there's activity, so
  #     without this the alarms would sit in INSUFFICIENT_DATA most of the time.
  #   OKActions -> also email when the alarm recovers, so you know it's resolved
  # ---------------------------------------------------------------------------

  # Separate topic for engineering alerts - a different audience from order
  # notifications. No topic policy needed: CloudWatch alarms in the same
  # account can publish with the topic's default policy.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: project4-alerts
      DisplayName: Project4 Alerts
      Tags:
        - Key: Project
          Value: project4-event-driven

  # Needs confirming by email, just like the order notifications subscription
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ANY message in the intake DLQ = an accepted order (customer got 202)
  # that could NOT be saved. This is the most important alarm in the system.
  OrderIntakeDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-order-intake-dlq-not-empty
      AlarmDescription: Accepted orders failed 3 times and were moved to the intake DLQ - investigate and redrive
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrderIntakeDLQ.QueueName
      Statistic: Maximum
      Period: 300                       # SQS queue-depth metrics arrive every few minutes
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold   # even ONE message is worth knowing about
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # ANY message in the fulfilment DLQ = an order that won't be shipped
  FulfilmentDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-fulfilment-dlq-not-empty
      AlarmDescription: Fulfilment messages failed 3 times and were moved to the fulfilment DLQ - investigate and redrive
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FulfilmentDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # Any CreateOrder error = accepted orders aren't being saved
  CreateOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-create-order-errors
      AlarmDescription: CreateOrder Lambda is throwing errors - accepted orders may not be saved
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateOrderFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold   # alarm on ANY error
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # Any FulfilOrder error = orders are being retried and may not be fulfilled
  FulfilOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-fulfil-order-errors
      AlarmDescription: FulfilOrder Lambda is throwing errors - fulfilment is being retried
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FulfilOrderFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # 5XX = OUR fault (server-side), including "couldn't write to the intake
  # queue". 4XX (bad input, no token) is the caller's fault, so it's shown on
  # the dashboard but deliberately NOT alarmed on.
  Api5xxErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-api-5xx-errors
      AlarmDescription: The orders API is returning server errors (5XX)
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: project4-orders-api
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # EventBridge matched an event but couldn't deliver it to the queue
  # (e.g. a broken queue policy). Events can be lost silently without this.
  FulfilmentRuleFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-fulfilment-rule-failed-invocations
      AlarmDescription: EventBridge failed to deliver OrderCreated events to the fulfilment queue
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:                       # rules on custom buses are identified by bus + rule name
        - Name: EventBusName
          Value: !Ref OrdersEventBus
        - Name: RuleName
          Value: project4-order-created-to-fulfilment
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # Same check for the notification rule -> SNS topic
  NotificationRuleFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-notification-rule-failed-invocations
      AlarmDescription: EventBridge failed to deliver OrderCreated events to the notifications topic
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: EventBusName
          Value: !Ref OrdersEventBus
        - Name: RuleName
          Value: project4-order-created-to-notification
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # SNS accepted the message but couldn't deliver it to a subscriber
  NotificationsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-notifications-failed
      AlarmDescription: SNS failed to deliver order notifications to subscribers
      Namespace: AWS/SNS
      MetricName: NumberOfNotificationsFailed
      Dimensions:
        - Name: TopicName
          Value: !GetAtt OrderNotificationsTopic.TopicName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # Intake backlog: orders accepted (202) but not saved within 5 minutes.
  # Customers think their order is placed, so this matters more than ever.
  OrderIntakeQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-order-intake-queue-backlog
      AlarmDescription: Accepted orders are waiting more than 5 minutes to be saved
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrderIntakeQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # Backlog check: if the oldest message has waited over 5 minutes, FulfilOrder
  # isn't keeping up (or is failing). Age is a better signal than message count:
  # 100 messages that clear in seconds is fine; 1 message stuck for an hour isn't.
  FulfilmentQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: project4-fulfilment-queue-backlog
      AlarmDescription: Messages are waiting more than 5 minutes in the fulfilment queue
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FulfilmentQueue.QueueName
      Statistic: Maximum                # the single oldest message, not an average
      Period: 300                       # 5-minute windows - SQS reports these metrics every few minutes
      EvaluationPeriods: 1
      Threshold: 300                    # seconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # ---------------------------------------------------------------------------
  # MONITORING (Exercises 4 and 7)
  # Dashboard laid out in the order an order travels:
  #   Row 0: alarm status (red/green at a glance)
  #   Row 1: API Gateway -> CreateOrder -> FulfilOrder
  #   Row 2: EventBridge matched / failed / DLQ, and SQS throughput (both queues)
  #   Row 3: SQS backlog + DLQ depth, and SNS delivery
  # The body is JSON inside !Sub, so ${...} inserts names and ARNs. (Comments
  # can't go inside the JSON block - they'd become part of it and break it.)
  # Rule names are written out because !Ref on a rule on a custom bus returns
  # "bus-name|rule-name", not just the rule name.
  # ---------------------------------------------------------------------------
  OrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: project4-orders-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "alarm", "x": 0, "y": 0, "width": 24, "height": 3,
              "properties": {
                "title": "Alarms",
                "alarms": [
                  "${OrderIntakeDLQAlarm.Arn}",
                  "${FulfilmentDLQAlarm.Arn}",
                  "${CreateOrderErrorsAlarm.Arn}",
                  "${FulfilOrderErrorsAlarm.Arn}",
                  "${Api5xxErrorsAlarm.Arn}",
                  "${FulfilmentRuleFailedInvocationsAlarm.Arn}",
                  "${NotificationRuleFailedInvocationsAlarm.Arn}",
                  "${NotificationsFailedAlarm.Arn}",
                  "${OrderIntakeQueueBacklogAlarm.Arn}",
                  "${FulfilmentQueueBacklogAlarm.Arn}"
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 3, "width": 8, "height": 6,
              "properties": {
                "title": "1. API Gateway - requests and errors",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "project4-orders-api"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "project4-orders-api"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "project4-orders-api"]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 3, "width": 8, "height": 6,
              "properties": {
                "title": "2. CreateOrder Lambda",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CreateOrderFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateOrderFunction}"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${CreateOrderFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 3, "width": 8, "height": 6,
              "properties": {
                "title": "5. FulfilOrder Lambda",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${FulfilOrderFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${FulfilOrderFunction}"],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${FulfilOrderFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 9, "width": 8, "height": 6,
              "properties": {
                "title": "3. EventBridge - MatchedEvents per rule",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-order-created-to-fulfilment"],
                  ["AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-order-created-to-notification"],
                  ["AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-log-all-order-events"]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 9, "width": 8, "height": 6,
              "properties": {
                "title": "3. EventBridge - FailedInvocations and DeadLetterInvocations",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/Events", "FailedInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-order-created-to-fulfilment"],
                  ["AWS/Events", "FailedInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-order-created-to-notification"],
                  ["AWS/Events", "DeadLetterInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-order-created-to-fulfilment"],
                  ["AWS/Events", "DeadLetterInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "project4-order-created-to-notification"]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 9, "width": 8, "height": 6,
              "properties": {
                "title": "4. SQS - messages in and out (intake + fulfilment)",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/SQS", "NumberOfMessagesSent", "QueueName", "${OrderIntakeQueue.QueueName}"],
                  ["AWS/SQS", "NumberOfMessagesDeleted", "QueueName", "${OrderIntakeQueue.QueueName}"],
                  ["AWS/SQS", "NumberOfMessagesSent", "QueueName", "${FulfilmentQueue.QueueName}"],
                  ["AWS/SQS", "NumberOfMessagesDeleted", "QueueName", "${FulfilmentQueue.QueueName}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 15, "width": 12, "height": 6,
              "properties": {
                "title": "4. SQS - backlog and dead-letter queues",
                "region": "${AWS::Region}", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${OrderIntakeQueue.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${FulfilmentQueue.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${OrderIntakeDLQ.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${FulfilmentDLQ.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${OrderIntakeQueue.QueueName}", {"stat": "Maximum", "yAxis": "right"}],
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${FulfilmentQueue.QueueName}", {"stat": "Maximum", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 15, "width": 12, "height": 6,
              "properties": {
                "title": "SNS - order notifications",
                "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/SNS", "NumberOfMessagesPublished", "TopicName", "${OrderNotificationsTopic.TopicName}"],
                  ["AWS/SNS", "NumberOfNotificationsDelivered", "TopicName", "${OrderNotificationsTopic.TopicName}"],
                  ["AWS/SNS", "NumberOfNotificationsFailed", "TopicName", "${OrderNotificationsTopic.TopicName}"]
                ]
              }
            }
          ]
        }

# Values published on the stack - shown by "aws cloudformation describe-stacks"
Outputs:
  OrdersTableName:
    Value: !Ref OrdersTable
  OrdersTableArn:
    Value: !GetAtt OrdersTable.Arn
  CreateOrderFunctionArn:
    Value: !GetAtt CreateOrderFunction.Arn
  OrdersApiUrl:
    Description: POST orders to this URL
    Value: !Join ["", ["https://", !Ref OrdersApi, ".execute-api.", !Ref "AWS::Region", ".amazonaws.com/prod/orders"]]
  UserPoolId:
    Value: !Ref OrdersUserPool
  UserPoolClientId:
    Value: !Ref OrdersUserPoolClient
  DashboardUrl:
    Description: Open this to see the dashboard
    Value: !Join ["", ["https://", !Ref "AWS::Region", ".console.aws.amazon.com/cloudwatch/home?region=", !Ref "AWS::Region", "#dashboards:name=project4-orders-dashboard"]]
  OrdersEventBusName:
    Value: !Ref OrdersEventBus
  OrdersEventBusArn:
    Value: !GetAtt OrdersEventBus.Arn
  OrderEventsLogGroupName:
    Value: !Ref OrderEventsLogGroup
  OrderIntakeQueueUrl:
    Value: !Ref OrderIntakeQueue
  OrderIntakeDLQUrl:
    Value: !Ref OrderIntakeDLQ
  FulfilmentQueueUrl:
    Value: !Ref FulfilmentQueue
  FulfilmentQueueArn:
    Value: !GetAtt FulfilmentQueue.Arn
  FulfilmentDLQUrl:
    Value: !Ref FulfilmentDLQ
  FulfilmentsTableName:
    Value: !Ref FulfilmentsTable
  FulfilOrderFunctionArn:
    Value: !GetAtt FulfilOrderFunction.Arn
  OrderNotificationsTopicArn:
    Value: !Ref OrderNotificationsTopic
  AlertsTopicArn:
    Value: !Ref AlertsTopic